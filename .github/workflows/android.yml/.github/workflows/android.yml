
name: Build CyberForge APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract CyberForge project
        run: |
          unzip -q CyberForge-GitHub-Ready.zip -d source

      - name: Build Android APK
        run: |
          gradle -p source/Cyberforge-main :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberForge-APK
          path: source/Cyberforge-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
